# Docker Compose Stack - Machine #2 INTRANET

# =============================================================================
# SERVICES INTRANET (LAN Privé)
# Machine #2 : Custom PC (i7-6700, 16 GB RAM, GTX 980, 4 TB HDD)
# Rôle : Stockage Famille + Services + VMs Lab
# =============================================================================

name: immich

services:

  # ========================================
  # NPM - NGINX PROXY MANAGER
  # ========================================
  npm:
    container_name: npm
    image: jc21/nginx-proxy-manager:2
    restart: unless-stopped
    ports:
      - 80:80
      - 443:443
      - 81:81
    volumes:
      - ./npm-data:/data
      - ./letsencrypt:/etc/letsencrypt
    environment:
      - TZ=Europe/Brussels


  # ========================================
  # IMMICH - Gestion photos
  # ========================================
  immich-server:
    container_name: immich_server
    image: ghcr.io/immich-app/immich-server:release
    volumes:
      - /mnt/photos:/usr/src/app/upload
      - /etc/localtime:/etc/localtime:ro
    environment:
      DB_HOSTNAME: immich_postgres
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE_NAME: immich
      REDIS_HOSTNAME: immich_redis
    ports:
      - 2283:2283
    depends_on:
      - redis
      - database
    restart: always

  immich-machine-learning:
    container_name: immich_machine_learning
    image: ghcr.io/immich-app/immich-machine-learning:release
    volumes:
      - model-cache:/cache
    restart: always

  # ========================================
  # REDIS & POSTGRESQL
  # ========================================
  redis:
    container_name: immich_redis
    image: redis:6.2-alpine
    restart: always

  database:
    container_name: immich_postgres
    image: tensorchord/pgvecto-rs:pg14-v0.2.0
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: postgres
      POSTGRES_DB: immich
    volumes:
      - /srv/postgres-data:/var/lib/postgresql/data
    restart: always

  # ========================================
  # MONITORING - Prometheus & Grafana
  # ========================================
  prometheus:
    container_name: prometheus
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=30d'
    restart: always

  grafana:
    container_name: grafana
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
    restart: always

  node-exporter:
    container_name: node_exporter
    image: prom/node-exporter:latest
    ports:
      - "9100:9100"
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
    restart: always

volumes:
  model-cache:
  prometheus-data:
  grafana-data:

# =============================================================================
# NOTES D'UTILISATION
# =============================================================================

# Prérequis :
#   - NFS mounts configurés : /mnt/photos, /mnt/files, /mnt/backups
#   - Fichier .env avec passwords configuré
#   - ZFS pool data-pool créé et monté

# Créer fichier .env :
#   cp .env.example .env
#   nano .env  # Modifier les passwords

# Démarrer stack :
#   docker-compose up -d

# Voir logs :
#   docker-compose logs -f immich
#   docker-compose logs -f nextcloud

# Arrêter stack :
#   docker-compose down

# Backup PostgreSQL :
#   docker exec postgres pg_dumpall -U postgres > backup.sql

# Restore PostgreSQL :
#   docker exec -i postgres psql -U postgres < backup.sql

# Accès Web UI :
#   - Immich : http://192.168.1.101:2283
#   - Nextcloud : http://192.168.1.101:8080
#   - Grafana : http://192.168.1.101:3000
#   - Prometheus : http://192.168.1.101:9090

# Accès externe (via reverse proxy Machine #1) :
#   - https://photos.elmzn.be → Immich
#   - https://files.elmzn.be → Nextcloud
#   - https://grafana.elmzn.be → Grafana

# Monitoring santé containers :
#   docker-compose ps
#   docker stats

# Mise à jour images :
#   docker-compose pull
#   docker-compose up -d
